<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260">
  <title>Figure 1: Ordered queue and retained completion record</title>
  <desc>Admission points to Pending queue, which points to Completion record. Pause points downward to Pending queue. This is a structural diagram with no numerical measurements.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker></defs>
  <rect width="820" height="260" fill="white"/>
  <g fill="#f1f5f9" stroke="#263238" stroke-width="2">
    <rect x="30" y="120" width="180" height="60" rx="8"/>
    <rect x="300" y="120" width="210" height="60" rx="8"/>
    <rect x="600" y="120" width="190" height="60" rx="8"/>
    <rect x="330" y="20" width="150" height="45" rx="8"/>
  </g>
  <g fill="#17242c" font-family="sans-serif" font-size="20" text-anchor="middle">
    <text x="120" y="158">Admission</text><text x="405" y="158">Pending queue</text>
    <text x="695" y="158">Completion record</text><text x="405" y="50">Pause</text>
  </g>
  <g fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)">
    <path d="M210 150 H290"/><path d="M510 150 H590"/><path d="M405 65 V110"/>
  </g>
  <text x="410" y="225" fill="#17242c" font-family="sans-serif" font-size="18" text-anchor="middle">Figure 1: Ordered queue and retained completion record</text>
</svg>
